<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071019">
<title>نظام النقاط | EduSpace</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,Tahoma,sans-serif;background:#071019;color:#f8f5ff}
body{padding:18px;background:radial-gradient(ellipse at 10% 0%,#bd4bc526,transparent 38%),radial-gradient(ellipse at 100% 25%,#7853df24,transparent 38%),linear-gradient(145deg,#071019,#0d202b,#08141d);background-attachment:fixed}
.container{max-width:850px;margin:auto}
.header{text-align:center;padding:15px 8px 24px}
.logo{width:65px;height:65px;margin:0 auto 13px;border-radius:21px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;background:linear-gradient(135deg,#ed62cf,#9656f5,#00c7a2);box-shadow:0 0 28px #b74fd94d}
h1{font-size:25px;margin:0 0 9px;color:#fff;text-shadow:0 0 15px #d879ff70}
.subtitle{font-size:13px;color:#c9c3df;line-height:1.8}
.panel{background:linear-gradient(145deg,#102530f5,#101727f7);border:1px solid #bd73e33d;border-radius:19px;padding:17px;margin-bottom:16px;box-shadow:0 10px 32px #0003;overflow:hidden}
.panel-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.panel-title h2{font-size:16px;color:#f2d5ff;margin:0}
.count{font-size:12px;color:#bdf7e8;background:#00c7a219;border:1px solid #00c7a24d;padding:7px 10px;border-radius:20px}
.table-wrap{width:100%;overflow-x:auto;border-radius:12px;border:1px solid #394454}
table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:380px}
th{padding:13px 7px;background:linear-gradient(100deg,#382342,#292044);color:#f6dcff;font-size:13px;text-align:center;border-bottom:1px solid #6d4a83}
td{padding:12px 7px;text-align:center;border-bottom:1px solid #ffffff10;color:#f5f1ff;font-size:13px;overflow-wrap:anywhere;line-height:1.8}
tr:last-child td{border-bottom:0}
tbody tr{background:#0c1924}
tbody tr:nth-child(even){background:#10202c}
tbody tr:hover{background:#1b2435}
.points-cell{color:#f2d7ff;font-weight:bold;text-shadow:0 0 10px #b764e52b}
.price-input,.type-select{width:100%;min-width:65px;padding:10px 5px;text-align:center;background:#071019;border:1px solid #58416c;border-radius:9px;color:#fff;font-size:14px;font-weight:bold;outline:none}
.price-input:focus,.type-select:focus{border-color:#e06dce;box-shadow:0 0 0 3px #d45bd21c}
.price-input.changed,.type-select.changed{border-color:#00c7a2;box-shadow:0 0 0 2px #00c7a218}
.type-select option{background:#10202c;color:#fff}
.price-input:disabled,.type-select:disabled{opacity:.65}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button{font-family:inherit;border:0;border-radius:11px;padding:13px 16px;font-size:14px;font-weight:bold;cursor:pointer;transition:transform .15s,opacity .2s}
button:active{transform:scale(.98)}
button:disabled{opacity:.55;cursor:wait}
.save-btn{flex:1;color:#fff;background:linear-gradient(110deg,#a347d1,#d650b6,#7653e8);box-shadow:0 5px 20px #a34cc42e}
.refresh-btn{color:#d8c7ff;background:linear-gradient(110deg,#292043,#19313e);border:1px solid #654c88}
.banner{display:none;padding:13px 15px;border-radius:11px;margin-bottom:15px;font-size:14px;line-height:1.8;overflow-wrap:anywhere}
.banner.show{display:block}
.banner.success{color:#b7ffe8;background:#0d332d;border:1px solid #16866a}
.banner.error{color:#ffd4e9;background:#391b30;border:1px solid #a84979}
.banner.loading{color:#ead7ff;background:#251d3c;border:1px solid #7551a5}
.empty{text-align:center;color:#c4b8d8;padding:30px 12px}
.footer{text-align:center;color:#9e9ab7;font-size:11px;padding:8px 0 18px}
@media(max-width:480px){body{padding:10px}.header{padding:10px 8px 19px}.logo{width:56px;height:56px;font-size:26px}h1{font-size:22px}.panel{padding:9px;border-radius:15px}.panel-title h2{font-size:14px}th{font-size:11px;padding:11px 4px}td{font-size:12px;padding:9px 4px}.price-input,.type-select{font-size:12px;padding:10px 2px;min-width:58px}.actions{gap:8px}.actions button{width:100%}}
</style>
</head>
<body>
<div class="container">
<header class="header">
<div class="logo">✦</div>
<h1>نظام النقاط</h1>
<div class="subtitle">EduSpace · إدارة التقييمات والأسعار</div>
</header>
<div id="banner" class="banner"></div>
<section class="panel">
<div class="panel-title">
<h2>✧ التقييمات والأسعار</h2>
<span id="count" class="count">0 تقييم</span>
</div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th style="width:42%">التقييم</th>
<th style="width:28%">السعر</th>
<th style="width:30%">النوع</th>
</tr>
</thead>
<tbody id="tableBody">
<tr><td colspan="3" class="empty">جاري تحميل البيانات...</td></tr>
</tbody>
</table>
</div>
<div class="actions">
<button id="saveBtn" class="save-btn" type="button">✦ إرسال التعديلات</button>
<button id="refreshBtn" class="refresh-btn" type="button">↻ تحديث البيانات</button>
</div>
</section>
<div class="footer">EduSpace · المنصة التعليمية</div>
</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwNVJwISviw_oBPH-cMiyEgtrf0h9nmjPUixpUL4nVwyqKYhdwnthec2_OcSjMVndPi/exec";
const FIRST_ROW=2;
const ITEMS_COUNT=8;
const TYPES=["مكافأة","خصم"];
const $=id=>document.getElementById(id);
let items=[];
let originalPrices={};
let loading=false;
function banner(message,type="loading"){$("banner").textContent=message;$("banner").className="banner show "+type;}
function clearBanner(){$("banner").textContent="";$("banner").className="banner";}
function parsePrice(value){const match=String(value??"").trim().match(/^(.+?)\s+(مكافأة|خصم)$/);return match?{price:match[1].trim(),type:match[2]}:{price:String(value??"").trim(),type:""};}
function makeSavedValue(price,type){return price.trim()+" "+type;}
function renderTable(){
const body=$("tableBody");
body.replaceChildren();
$("count").textContent=items.length+" تقييم";
if(items.length!==ITEMS_COUNT){const tr=document.createElement("tr");const td=document.createElement("td");td.colSpan=3;td.className="empty";td.textContent="يجب وجود 8 تقييمات من الصف الثاني إلى الصف التاسع.";tr.appendChild(td);body.appendChild(tr);return;}
items.forEach(item=>{
const tr=document.createElement("tr");
const pointsCell=document.createElement("td");
pointsCell.className="points-cell";
pointsCell.textContent=String(item.points??"");
const parsed=parsePrice(item.price);
const priceCell=document.createElement("td");
const priceInput=document.createElement("input");
priceInput.className="price-input";
priceInput.type="text";
priceInput.inputMode="decimal";
priceInput.maxLength=45;
priceInput.value=parsed.price;
priceInput.dataset.row=String(item.row);
priceInput.setAttribute("aria-label","سعر التقييم "+item.points);
const typeCell=document.createElement("td");
const typeSelect=document.createElement("select");
typeSelect.className="type-select";
typeSelect.dataset.row=String(item.row);
typeSelect.setAttribute("aria-label","نوع السعر "+item.points);
const placeholder=document.createElement("option");
placeholder.value="";
placeholder.textContent="اختر النوع";
typeSelect.appendChild(placeholder);
TYPES.forEach(type=>{const option=document.createElement("option");option.value=type;option.textContent=type;typeSelect.appendChild(option);});
typeSelect.value=parsed.type;
function updateChanged(){const original=parsePrice(originalPrices[item.row]??"");priceInput.classList.toggle("changed",priceInput.value.trim()!==original.price);typeSelect.classList.toggle("changed",typeSelect.value!==original.type);}
priceInput.addEventListener("input",updateChanged);
typeSelect.addEventListener("change",updateChanged);
priceCell.appendChild(priceInput);
typeCell.appendChild(typeSelect);
tr.append(pointsCell,priceCell,typeCell);
body.appendChild(tr);
});
}
async function loadData(){
if(loading)return;
loading=true;
$("refreshBtn").disabled=true;
$("saveBtn").disabled=true;
banner("جاري تحميل بيانات النقاط...","loading");
try{
const response=await fetch(API_URL+"?action=getPoints&_="+Date.now(),{cache:"no-store"});
const data=await response.json();
if(!data.success)throw new Error(data.message||"تعذر جلب البيانات");
items=Array.isArray(data.items)?data.items:[];
if(items.length!==ITEMS_COUNT||items.some((item,i)=>Number(item.row)!==FIRST_ROW+i||!String(item.points??"").trim()))throw new Error("يجب وجود 8 تقييمات صحيحة من الصف الثاني إلى الصف التاسع.");
originalPrices={};
items.forEach(item=>originalPrices[item.row]=String(item.price??""));
renderTable();
banner("تم تحميل البيانات بنجاح.","success");
setTimeout(()=>{if($("banner").classList.contains("success"))clearBanner();},2200);
}catch(error){
items=[];
renderTable();
banner(error.message||"تعذر الاتصال بالخادم.","error");
}finally{
loading=false;
$("refreshBtn").disabled=false;
$("saveBtn").disabled=false;
}
}
async function saveChanges(){
if(loading)return;
if(items.length!==ITEMS_COUNT){banner("حدّث البيانات وتأكد من وجود التقييمات الثمانية.","error");return;}
const rows=Array.from(document.querySelectorAll("#tableBody tr"));
if(rows.length!==ITEMS_COUNT){banner("عدد التقييمات غير صحيح.","error");return;}
const payloadItems=[];
for(let i=0;i<ITEMS_COUNT;i++){
const item=items[i];
const row=FIRST_ROW+i;
const priceInput=rows[i].querySelector(".price-input");
const typeSelect=rows[i].querySelector(".type-select");
const price=priceInput.value.trim();
const type=typeSelect.value;
if(Number(item.row)!==row||!String(item.points??"").trim()){banner("بيانات التقييمات غير صحيحة. حدّث البيانات.","error");return;}
if(!price||price.length>45||/^[=+\-@]/.test(price)||/[\r\n]/.test(price)){banner("أدخل سعرًا صحيحًا في الصف "+row+".","error");priceInput.focus();return;}
if(!TYPES.includes(type)){banner("اختر مكافأة أو خصم في الصف "+row+".","error");typeSelect.focus();return;}
payloadItems.push({row:row,points:String(item.points).trim(),price:makeSavedValue(price,type)});
}
const changes=payloadItems.filter(item=>item.price!==String(originalPrices[item.row]??"").trim());
if(!changes.length){banner("لا توجد تعديلات جديدة لإرسالها.","loading");return;}
loading=true;
$("saveBtn").disabled=true;
$("refreshBtn").disabled=true;
document.querySelectorAll(".price-input,.type-select").forEach(input=>input.disabled=true);
banner("جاري إرسال الأسعار والأنواع الثمانية في طلب واحد...","loading");
try{
const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"updatePrices",items:payloadItems})});
const data=await response.json();
if(!data.success)throw new Error(data.message||"تعذر تحديث الأسعار");
payloadItems.forEach(item=>{originalPrices[item.row]=item.price;const current=items.find(x=>Number(x.row)===item.row);if(current)current.price=item.price;});
renderTable();
banner("تم حفظ الأسعار والأنواع الثمانية بنجاح.","success");
}catch(error){
banner((error.message||"تعذر الاتصال بالخادم.")+" حدّث البيانات للتحقق من الحفظ قبل إعادة المحاولة.","error");
}finally{
loading=false;
$("saveBtn").disabled=false;
$("refreshBtn").disabled=false;
document.querySelectorAll(".price-input,.type-select").forEach(input=>input.disabled=false);
}
}
$("saveBtn").addEventListener("click",saveChanges);
$("refreshBtn").addEventListener("click",loadData);
loadData();
</script>
</body>
</html>
